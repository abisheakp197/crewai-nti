name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        run: |
          set -euo pipefail
          # Check only the commits this push or pull request adds. These repos
          # have commits from before sign-off was enforced, and checking from
          # the root commit would fail every run on that history.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::cannot resolve base commit ${base}"
            exit 1
          fi
          missing=0
          while read -r sha; do
            [ -z "${sha}" ] && continue
            if ! git log -1 --format='%B' "${sha}" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit ${sha} is missing a Signed-off-by line"
              missing=1
            fi
          done < <(git rev-list "${base}..HEAD")
          exit "${missing}"

  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Show resolved dependency versions
        run: pip show ube-foundation
      - name: Run tests
        run: pytest -q

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
