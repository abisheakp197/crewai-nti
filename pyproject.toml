[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-nti"
version = "0.1.0"
description = "Full 5-pillar NTI post-quantum security for CrewAI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Shield-1.0.0" }
authors = [{ name = "Abisheak", email = "abisheakp197@gmail.com" }]
keywords = [
    "crewai",
    "ai-agents",
    "post-quantum-cryptography",
    "pqc",
    "dilithium5",
    "kyber1024",
    "zero-trust",
    "bft-consensus",
    "merkle-audit",
    "agent-mesh",
    "ai-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "crewai>=0.30.0",
    "ube-foundation>=0.1.0",
]

[project.urls]
Homepage = "https://abisheakp197.github.io/Neutral-Trust-Infrastructure/"
Repository = "https://github.com/abisheakp197/crewai-nti"
Issues = "https://github.com/abisheakp197/crewai-nti/issues"

[tool.setuptools.packages.find]
include = ["crewai_nti*"]
